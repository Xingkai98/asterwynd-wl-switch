# 由 `witnessloop init` 生成，请勿手改——`witnessloop uninit` 依
# .witnessloop/init-manifest.json 的 hash 台账回滚它。
# 门禁本体住在 reusable workflow 里，本文件只是 caller。
name: witnessloop

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    uses: Xingkai98/witnessloop/.github/workflows/gate.yml@v1
    # ⚠️ 实验手段：手改 `witnessloop init` 生成的文件。caller 里固定的 workflow 是 @v1，
    # 而包默认也取 v1（= ae99256，不含 PR #22/#25/#28 的修复）⇒ 要吃到包修复只能显式钉 sha。
    with:
      witnessloop-ref: eaca56898c2caf456f46eec00f76a35fc446d9aa
